[project]
name = "clothing-ai-assistant"
version = "0.1.0"
description = "Backend API for the clothing AI assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pymysql>=1.1,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.1.1,<10.0",
]
migrations = [
    "alembic>=1.13,<2.0",
]

[tool.uv]
package = false
